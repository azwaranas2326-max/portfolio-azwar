<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="uiuxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5F0" />
      <stop offset="50%" stop-color="#EFECE3" />
      <stop offset="100%" stop-color="#E5E0D5" />
    </linearGradient>
    <radialGradient id="uiAura" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#581C87" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#1B4332" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#EFECE3" stop-opacity="0" />
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#111111" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#uiuxBg)" />
  <rect width="800" height="500" fill="url(#uiAura)" />

  <!-- Subtle Dot Grid Matrix -->
  <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="0.75" fill="#111111" fill-opacity="0.12" />
  </pattern>
  <rect width="800" height="500" fill="url(#dotPattern)" />

  <!-- Desktop App Window Mockup -->
  <g transform="translate(60, 45)" filter="url(#cardShadow)">
    <!-- Browser/Figma Frame -->
    <rect width="460" height="380" rx="14" fill="#FFFFFF" stroke="#111111" stroke-opacity="0.1" stroke-width="1.2" />
    
    <!-- Window Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 446 0 Q 460 0 460 14 L 460 38 L 0 38 Z" fill="#FBF9F5" stroke="#111111" stroke-opacity="0.08" stroke-width="1" />
    <circle cx="22" cy="19" r="4.5" fill="#EF4444" fill-opacity="0.7" />
    <circle cx="36" cy="19" r="4.5" fill="#F59E0B" fill-opacity="0.7" />
    <circle cx="50" cy="19" r="4.5" fill="#10B981" fill-opacity="0.7" />
    
    <rect x="150" y="10" width="160" height="18" rx="9" fill="#111111" fill-opacity="0.05" />
    <text x="230" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#78716C" text-anchor="middle" font-weight="500">figma.com/design-concept</text>

    <!-- Sidebar & Content -->
    <rect x="0" y="38" width="85" height="342" fill="#FAF8F3" stroke="#111111" stroke-opacity="0.06" stroke-width="1" />
    <rect x="16" y="55" width="53" height="8" rx="4" fill="#111111" fill-opacity="0.15" />
    <rect x="16" y="75" width="42" height="6" rx="3" fill="#111111" fill-opacity="0.1" />
    <rect x="16" y="92" width="48" height="6" rx="3" fill="#111111" fill-opacity="0.1" />
    <rect x="16" y="109" width="38" height="6" rx="3" fill="#111111" fill-opacity="0.1" />
    <rect x="16" y="126" width="45" height="6" rx="3" fill="#111111" fill-opacity="0.1" />

    <!-- Canvas Workspace Mockup -->
    <g transform="translate(105, 55)">
      <!-- Wireframe Card 1 -->
      <rect width="160" height="130" rx="8" fill="#FBF9F5" stroke="#111111" stroke-opacity="0.1" />
      <rect x="12" y="14" width="70" height="10" rx="5" fill="#111111" fill-opacity="0.7" />
      <rect x="12" y="32" width="136" height="5" rx="2.5" fill="#78716C" fill-opacity="0.4" />
      <rect x="12" y="42" width="115" height="5" rx="2.5" fill="#78716C" fill-opacity="0.4" />
      <rect x="12" y="52" width="95" height="5" rx="2.5" fill="#78716C" fill-opacity="0.4" />
      
      <!-- Interactive Button Component inside Mockup -->
      <rect x="12" y="75" width="75" height="24" rx="12" fill="#111111" />
      <text x="49" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">Explore</text>

      <rect x="94" y="75" width="54" height="24" rx="12" fill="none" stroke="#111111" stroke-opacity="0.25" stroke-width="1" />
      <text x="121" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#111111" text-anchor="middle">Details</text>

      <!-- Wireframe Card 2 (Analytics / Dashboard Widget) -->
      <g transform="translate(175, 0)">
        <rect width="155" height="130" rx="8" fill="#FBF9F5" stroke="#111111" stroke-opacity="0.1" />
        <rect x="12" y="14" width="85" height="8" rx="4" fill="#1B4332" />
        <!-- Micro bar chart -->
        <rect x="15" y="75" width="14" height="35" rx="3" fill="#1B4332" fill-opacity="0.3" />
        <rect x="36" y="55" width="14" height="55" rx="3" fill="#1B4332" fill-opacity="0.7" />
        <rect x="57" y="40" width="14" height="70" rx="3" fill="#1B4332" />
        <rect x="78" y="65" width="14" height="45" rx="3" fill="#581C87" fill-opacity="0.4" />
        <rect x="99" y="30" width="14" height="80" rx="3" fill="#581C87" />
        <rect x="120" y="50" width="14" height="60" rx="3" fill="#581C87" fill-opacity="0.6" />
      </g>

      <!-- Design System Color Chips & Typography Tokens Mockup -->
      <g transform="translate(0, 150)">
        <text x="0" y="14" font-family="'Playfair Display', serif" font-size="12" font-weight="700" fill="#111111">Design Tokens &amp; Components</text>
        
        <circle cx="14" cy="38" r="10" fill="#111111" />
        <circle cx="42" cy="38" r="10" fill="#1B4332" />
        <circle cx="70" cy="38" r="10" fill="#581C87" />
        <circle cx="98" cy="38" r="10" fill="#F4F1EA" stroke="#111111" stroke-opacity="0.15" />
        <circle cx="126" cy="38" r="10" fill="#FFFFFF" stroke="#111111" stroke-opacity="0.15" />

        <g transform="translate(160, 22)">
          <rect width="170" height="34" rx="6" fill="#F4F1EA" stroke="#111111" stroke-opacity="0.08" />
          <text x="12" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#111111">Auto-Layout &amp; Variants Active</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Mobile App Preview Mockup overlapping on the right -->
  <g transform="translate(560, 90)" filter="url(#cardShadow)">
    <rect width="180" height="340" rx="24" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />
    
    <!-- Phone Notch -->
    <rect x="60" y="8" width="60" height="12" rx="6" fill="#111111" />
    
    <!-- Screen Content -->
    <g transform="translate(18, 36)">
      <!-- Header -->
      <circle cx="14" cy="14" r="12" fill="#F4F1EA" />
      <rect x="36" y="8" width="65" height="7" rx="3.5" fill="#111111" />
      <rect x="36" y="18" width="40" height="5" rx="2.5" fill="#78716C" />
      
      <!-- Hero Banner in mobile -->
      <rect x="0" y="38" width="144" height="85" rx="12" fill="#1B4332" />
      <text x="14" y="65" font-family="'Playfair Display', serif" font-size="12" font-weight="700" fill="#FFFFFF">E-Service</text>
      <text x="14" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#F0F7F3" fill-opacity="0.8">Interface Redesign</text>
      <rect x="14" y="92" width="55" height="16" rx="8" fill="#FFFFFF" />
      <text x="41.5" y="103" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="700" fill="#1B4332" text-anchor="middle">View Prototype</text>

      <!-- Quick Action Cards in mobile -->
      <g transform="translate(0, 138)">
        <rect width="66" height="58" rx="8" fill="#F7F5F0" stroke="#111111" stroke-opacity="0.08" />
        <circle cx="20" cy="22" r="8" fill="#581C87" fill-opacity="0.15" />
        <rect x="12" y="38" width="42" height="5" rx="2.5" fill="#111111" />
        <rect x="12" y="46" width="30" height="4" rx="2" fill="#78716C" />

        <g transform="translate(78, 0)">
          <rect width="66" height="58" rx="8" fill="#F7F5F0" stroke="#111111" stroke-opacity="0.08" />
          <circle cx="20" cy="22" r="8" fill="#1B4332" fill-opacity="0.15" />
          <rect x="12" y="38" width="42" height="5" rx="2.5" fill="#111111" />
          <rect x="12" y="46" width="30" height="4" rx="2" fill="#78716C" />
        </g>
      </g>

      <!-- Bottom Navigation Bar inside Phone -->
      <g transform="translate(0, 252)">
        <line x1="0" y1="0" x2="144" y2="0" stroke="#111111" stroke-opacity="0.08" />
        <circle cx="24" cy="18" r="5" fill="#111111" />
        <circle cx="72" cy="18" r="5" fill="#78716C" fill-opacity="0.5" />
        <circle cx="120" cy="18" r="5" fill="#78716C" fill-opacity="0.5" />
      </g>
    </g>
  </g>
</svg>
